<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>M2SEC Interfácil - Logo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px;
    height: 1080px;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: radial-gradient(circle at 35% 30%, #1e88e5 0%, #0d47a1 55%, #002171 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    text-align: center;
  }
  .icon {
    width: 220px;
    height: 220px;
    margin: 0 auto 30px;
    background: #ffd54f;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 130px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  }
  .name {
    color: #ffffff;
    font-size: 96px;
    font-weight: 800;
    letter-spacing: -2px;
  }
  .name span { color: #ffd54f; }
  .tag {
    margin-top: 18px;
    color: #cfe0ff;
    font-size: 30px;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🔓</div>
    <div class="name">M2SEC <span>Interfácil</span></div>
    <div class="tag">Consultoria financeira da M2SEC</div>
  </div>
</body>
</html>
