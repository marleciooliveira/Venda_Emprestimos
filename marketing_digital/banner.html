<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Empréstimo Negativado - Banner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px;
    height: 1080px;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(160deg, #6a1b9a 0%, #8e24aa 45%, #ff8f00 100%);
    position: relative;
    overflow: hidden;
    color: #fff;
  }
  .sun {
    position: absolute;
    top: -120px; right: -120px;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, #ffd54f 0%, #ff8f00 70%, transparent 100%);
    opacity: 0.85;
  }
  .content {
    position: relative;
    z-index: 2;
    padding: 70px 60px;
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  .badge {
    background: #ffd54f;
    color: #6a1b9a;
    font-weight: 800;
    font-size: 30px;
    padding: 12px 28px;
    border-radius: 40px;
    display: inline-block;
    align-self: flex-start;
    box-shadow: 0 6px 14px rgba(0,0,0,0.25);
  }
  h1 {
    font-size: 78px;
    line-height: 1.05;
    margin-top: 30px;
    text-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  h1 span { color: #ffd54f; }
  .sub {
    font-size: 38px;
    margin-top: 18px;
    font-weight: 600;
    opacity: 0.95;
  }
  .scene {
    margin-top: auto;
    display: flex;
    align-items: stretch;
    justify-content: center;
    gap: 24px;
    height: 420px;
  }
  .scene img {
    height: 100%;
    width: 50%;
    object-fit: cover;
    border-radius: 24px;
    box-shadow: 0 12px 26px rgba(0,0,0,0.4);
    border: 4px solid rgba(255,255,255,0.25);
  }
  .cta {
    margin-top: 40px;
    background: #ffd54f;
    color: #4a148c;
    font-size: 40px;
    font-weight: 800;
    text-align: center;
    padding: 22px;
    border-radius: 18px;
    box-shadow: 0 8px 18px rgba(0,0,0,0.3);
  }
  .link {
    margin-top: 16px;
    font-size: 22px;
    text-align: center;
    background: rgba(0,0,0,0.25);
    padding: 14px;
    border-radius: 12px;
    word-break: break-all;
  }
  .approval {
    position: absolute;
    top: 40px; right: 50px;
    background: #2e7d32;
    padding: 14px 26px;
    border-radius: 50px;
    font-size: 26px;
    font-weight: 800;
    box-shadow: 0 6px 14px rgba(0,0,0,0.3);
    z-index: 3;
  }
</style>
</head>
<body>
  <div class="sun"></div>
  <div class="approval">✅ Alto nível de aprovação</div>
  <div class="content">
    <div class="badge">NUBANK • DINHEIRO NA CONTA</div>
    <h1>Empréstimo para <span>Negativado</span></h1>
    <div class="sub">Direto na sua conta Nubank — simule agora! 🍻🥩</div>

    <div class="scene">
      <img src="foto1_cerveja.jpg" alt="Amigos brindando cerveja">
      <img src="foto2_churrasco.jpg" alt="Amigos no churrasco">
    </div>

    <div class="cta">👉 Simule grátis, sem compromisso!</div>
    <div class="link">facio.com.br/?amigo=185c0b9f-d9d0-43d4-a8c9-af1718c1bff5</div>
  </div>
</body>
</html>
