<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Empréstimo Negativado - Banner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px;
    height: 1080px;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(160deg, #6a1b9a 0%, #8e24aa 45%, #ff8f00 100%);
    position: relative;
    overflow: hidden;
    color: #fff;
  }
  .sun {
    position: absolute;
    top: -120px; right: -120px;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, #ffd54f 0%, #ff8f00 70%, transparent 100%);
    opacity: 0.85;
  }
  .content {
    position: relative;
    z-index: 2;
    padding: 70px 60px;
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  .badge {
    background: #ffd54f;
    color: #6a1b9a;
    font-weight: 800;
    font-size: 30px;
    padding: 12px 28px;
    border-radius: 40px;
    display: inline-block;
    align-self: flex-start;
    box-shadow: 0 6px 14px rgba(0,0,0,0.25);
  }
  h1 {
    font-size: 78px;
    line-height: 1.05;
    margin-top: 30px;
    text-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  h1 span { color: #ffd54f; }
  .sub {
    font-size: 38px;
    margin-top: 18px;
    font-weight: 600;
    opacity: 0.95;
  }
  .scene {
    margin-top: auto;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 40px;
    height: 420px;
    position: relative;
  }
  .person {
    width: 170px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .head {
    width: 90px; height: 90px;
    border-radius: 50%;
    position: relative;
  }
  .skin1 { background: #e0a878; }
  .skin2 { background: #8d5524; }
  .skin3 { background: #c68642; }
  .body {
    width: 130px; height: 190px;
    border-radius: 40px 40px 0 0;
    margin-top: -15px;
  }
  .shirt1 { background: #2e7d32; }
  .shirt2 { background: #d84315; }
  .shirt3 { background: #1565c0; }
  .cup {
    width: 40px; height: 55px;
    background: linear-gradient(#fff3c4, #ffca28);
    border: 3px solid #fff8e1;
    border-radius: 4px 4px 10px 10px;
    position: absolute;
    right: -20px;
    top: 60px;
    transform: rotate(15deg);
  }
  .grill {
    width: 260px;
    height: 110px;
    background: #37474f;
    border-radius: 14px;
    position: relative;
    box-shadow: 0 10px 20px rgba(0,0,0,0.35);
  }
  .grill:before {
    content: "";
    position: absolute;
    top: -22px; left: 20px; right: 20px;
    height: 24px;
    background: repeating-linear-gradient(90deg, #6d4c1c 0 18px, #8d6e3a 18px 36px);
    border-radius: 6px;
  }
  .smoke {
    position: absolute;
    top: -70px; left: 100px;
    width: 40px; height: 40px;
    background: rgba(255,255,255,0.55);
    border-radius: 50%;
    filter: blur(6px);
    animation: none;
  }
  .smoke.s2 { top: -110px; left: 130px; width: 55px; height: 55px; opacity: 0.4;}
  .cta {
    margin-top: 40px;
    background: #ffd54f;
    color: #4a148c;
    font-size: 40px;
    font-weight: 800;
    text-align: center;
    padding: 22px;
    border-radius: 18px;
    box-shadow: 0 8px 18px rgba(0,0,0,0.3);
  }
  .link {
    margin-top: 16px;
    font-size: 22px;
    text-align: center;
    background: rgba(0,0,0,0.25);
    padding: 14px;
    border-radius: 12px;
    word-break: break-all;
  }
  .approval {
    position: absolute;
    top: 40px; right: 50px;
    background: #2e7d32;
    padding: 14px 26px;
    border-radius: 50px;
    font-size: 26px;
    font-weight: 800;
    box-shadow: 0 6px 14px rgba(0,0,0,0.3);
    z-index: 3;
  }
</style>
</head>
<body>
  <div class="sun"></div>
  <div class="approval">✅ Alto nível de aprovação</div>
  <div class="content">
    <div class="badge">NUBANK • DINHEIRO NA CONTA</div>
    <h1>Empréstimo para <span>Negativado</span></h1>
    <div class="sub">Direto na sua conta Nubank — simule agora! 🍻🥩</div>

    <div class="scene">
      <div class="person">
        <div class="head skin1"></div>
        <div class="body shirt1">
          <div class="cup"></div>
        </div>
      </div>
      <div style="position:relative;">
        <div class="smoke"></div>
        <div class="smoke s2"></div>
        <div class="grill"></div>
      </div>
      <div class="person">
        <div class="head skin2"></div>
        <div class="body shirt2">
          <div class="cup"></div>
        </div>
      </div>
      <div class="person">
        <div class="head skin3"></div>
        <div class="body shirt3">
          <div class="cup"></div>
        </div>
      </div>
    </div>

    <div class="cta">👉 Simule grátis, sem compromisso!</div>
    <div class="link">facio.com.br/?amigo=185c0b9f-d9d0-43d4-a8c9-af1718c1bff5</div>
  </div>
</body>
</html>
