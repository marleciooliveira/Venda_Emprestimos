<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>M2SEC Security - Ícone</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 600px;
    height: 600px;
    background:
      radial-gradient(circle at 50% 42%, #1b2230 0%, #0c0f16 60%, #040509 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-wrap {
    width: 400px;
    height: 400px;
    display: flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0 14px 30px rgba(0,0,0,0.6));
  }
</style>
</head>
<body>
  <div class="icon-wrap">
    <svg width="400" height="400" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#f8e8b0"/>
          <stop offset="45%" stop-color="#d4af37"/>
          <stop offset="100%" stop-color="#8c6c1f"/>
        </linearGradient>
        <linearGradient id="silver" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#f4f6f8"/>
          <stop offset="50%" stop-color="#c4cad4"/>
          <stop offset="100%" stop-color="#8a909c"/>
        </linearGradient>
        <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#232a3a"/>
          <stop offset="100%" stop-color="#0e121c"/>
        </linearGradient>
      </defs>

      <path d="M120,6 L213,53 L213,142 L120,234 L27,142 L27,53 Z"
            fill="url(#shieldFill)"
            stroke="url(#gold)"
            stroke-width="5"/>
      <path d="M120,20 L199,60 L199,137 L120,216 L41,137 L41,60 Z"
            fill="none"
            stroke="url(#silver)"
            stroke-width="1.4"
            opacity="0.45"/>

      <g stroke="url(#gold)" stroke-width="2.4" fill="none" opacity="0.9">
        <path d="M120,34 L120,76"/>
        <path d="M70,66 L96,88"/>
        <path d="M170,66 L144,88"/>
        <path d="M60,118 L92,118"/>
        <path d="M180,118 L148,118"/>
        <path d="M80,172 L100,150"/>
        <path d="M160,172 L140,150"/>
      </g>
      <g fill="url(#gold)">
        <circle cx="120" cy="34" r="4"/>
        <circle cx="70" cy="66" r="4"/>
        <circle cx="170" cy="66" r="4"/>
        <circle cx="60" cy="118" r="4"/>
        <circle cx="180" cy="118" r="4"/>
        <circle cx="80" cy="172" r="4"/>
        <circle cx="160" cy="172" r="4"/>
      </g>

      <rect x="90" y="88" width="60" height="60" rx="10"
            fill="url(#shieldFill)" stroke="url(#gold)" stroke-width="3.5"/>
      <rect x="102" y="100" width="36" height="36" rx="4"
            fill="none" stroke="url(#silver)" stroke-width="1.2" opacity="0.55"/>
      <path d="M120,110 a9,9 0 1 1 -0.1,0 Z M120,119 l0,14"
            fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
    </svg>
  </div>
</body>
</html>
