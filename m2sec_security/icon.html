<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>M2SEC Security - Ícone</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 600px;
    height: 600px;
    background:
      radial-gradient(circle at 50% 42%, #1b2230 0%, #0c0f16 60%, #040509 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-wrap {
    width: 400px;
    height: 400px;
    display: flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0 14px 30px rgba(0,0,0,0.6));
  }
</style>
</head>
<body>
  <div class="icon-wrap">
    <svg width="400" height="400" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#f8e8b0"/>
          <stop offset="45%" stop-color="#d4af37"/>
          <stop offset="100%" stop-color="#8c6c1f"/>
        </linearGradient>
        <linearGradient id="silver" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#f4f6f8"/>
          <stop offset="50%" stop-color="#c4cad4"/>
          <stop offset="100%" stop-color="#8a909c"/>
        </linearGradient>
        <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#232a3a"/>
          <stop offset="100%" stop-color="#0e121c"/>
        </linearGradient>
      </defs>

      <path d="M120,6 L213,53 L213,142 L120,234 L27,142 L27,53 Z"
            fill="url(#shieldFill)" stroke="url(#gold)" stroke-width="5"/>
      <path d="M120,20 L199,60 L199,137 L120,216 L41,137 L41,60 Z"
            fill="none" stroke="url(#silver)" stroke-width="1.4" opacity="0.45"/>

      <path d="M100,104 L100,90 C100,76 109,66 120,66 C131,66 140,76 140,90 L140,104"
            fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
      <circle cx="100" cy="104" r="4.5" fill="url(#gold)"/>
      <circle cx="140" cy="104" r="4.5" fill="url(#gold)"/>

      <rect x="84" y="100" width="72" height="62" rx="9"
            fill="url(#shieldFill)" stroke="url(#gold)" stroke-width="4"/>
      <g stroke="url(#silver)" stroke-width="1" opacity="0.35">
        <path d="M84,118 L156,118"/>
        <path d="M84,136 L156,136"/>
        <path d="M108,100 L108,162"/>
        <path d="M132,100 L132,162"/>
      </g>
      <g fill="url(#gold)" opacity="0.85">
        <circle cx="108" cy="118" r="2.3"/>
        <circle cx="132" cy="118" r="2.3"/>
        <circle cx="108" cy="136" r="2.3"/>
        <circle cx="132" cy="136" r="2.3"/>
      </g>
      <circle cx="120" cy="127" r="8" fill="url(#gold)"/>
      <rect x="117" y="131" width="6" height="13" rx="2" fill="url(#gold)"/>
    </svg>
  </div>
</body>
</html>
