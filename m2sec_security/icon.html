<!doctype html>
<html lang="pt-BR">
<head>

<title>M2SEC Security - Ícone</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

    background:

    align-items: center;

  .icon-wrap {
    width: 380px;
    height: 380px;
