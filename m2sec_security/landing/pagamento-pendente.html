<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagamento pendente — M2SEC Security</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --bg:#040509; --bg2:#0c0f16; --border:#2a3040;
    --gold-1:#f8e8b0; --gold-2:#d4af37; --gold-3:#8c6c1f;
    --text:#f3f4f6; --muted:#9aa1b0; --amber:#e0a93f;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;text-align:center;
  }
  .card{max-width:480px;background:var(--bg2);border:1.5px solid var(--border);border-radius:20px;padding:44px 36px;}
  .icon{
    width:64px;height:64px;border-radius:50%;background:rgba(224,169,63,0.15);
    display:flex;align-items:center;justify-content:center;margin:0 auto 22px;
    font-size:30px;color:var(--amber);border:1.5px solid rgba(224,169,63,0.4);
  }
  h1{font-size:26px;margin-bottom:14px;}
  p{color:var(--muted);font-size:15px;margin-bottom:28px;line-height:1.6;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:14px 24px;border-radius:12px;font-weight:700;font-size:15px;
    text-decoration:none;
    background:linear-gradient(180deg,var(--gold-1) 0%,var(--gold-2) 60%,var(--gold-3) 100%);
    color:#0c0f16;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">⏳</div>
    <h1>Pagamento em análise</h1>
    <p>Seu pagamento está sendo processado (comum em boleto e algumas formas de Pix/cartão). Assim que for aprovado, a gente te chama no WhatsApp pra iniciar o processo.</p>
    <a class="btn" href="https://wa.me/5561996447858?text=Oi!%20Meu%20pagamento%20ficou%20pendente%2C%20pode%20me%20ajudar%3F" target="_blank" rel="noopener">📲 Falar no WhatsApp</a>
  </div>
</body>
</html>
