<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagamento não aprovado — M2SEC Security</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --bg:#040509; --bg2:#0c0f16; --border:#2a3040;
    --gold-1:#f8e8b0; --gold-2:#d4af37; --gold-3:#8c6c1f;
    --text:#f3f4f6; --muted:#9aa1b0; --red:#e05f5f;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;text-align:center;
  }
  .card{max-width:480px;background:var(--bg2);border:1.5px solid var(--border);border-radius:20px;padding:44px 36px;}
  .icon{
    width:64px;height:64px;border-radius:50%;background:rgba(224,95,95,0.15);
    display:flex;align-items:center;justify-content:center;margin:0 auto 22px;
    font-size:30px;color:var(--red);border:1.5px solid rgba(224,95,95,0.4);
  }
  h1{font-size:26px;margin-bottom:14px;}
  p{color:var(--muted);font-size:15px;margin-bottom:28px;line-height:1.6;}
  .btn-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:14px 22px;border-radius:12px;font-weight:700;font-size:15px;
    text-decoration:none;
  }
  .btn-gold{
    background:linear-gradient(180deg,var(--gold-1) 0%,var(--gold-2) 60%,var(--gold-3) 100%);
    color:#0c0f16;
  }
  .btn-ghost{background:rgba(255,255,255,0.04);color:var(--text);border:1.5px solid var(--border);}
</style>
</head>
<body>
  <div class="card">
    <div class="icon">✕</div>
    <h1>Pagamento não aprovado</h1>
    <p>Seu pagamento não foi concluído. Isso pode acontecer por limite do cartão, dados incorretos ou cancelamento no meio do processo. Nenhum valor foi cobrado.</p>
    <div class="btn-row">
      <a class="btn btn-gold" href="/index.html#planos">Tentar novamente</a>
      <a class="btn btn-ghost" href="https://wa.me/5561996447858?text=Oi!%20Meu%20pagamento%20n%C3%A3o%20foi%20aprovado%2C%20pode%20me%20ajudar%3F" target="_blank" rel="noopener">Falar no WhatsApp</a>
    </div>
  </div>
</body>
</html>
