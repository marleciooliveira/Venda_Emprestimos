<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>M2SEC Security - Logo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px;
    height: 1080px;
    font-family: 'Segoe UI', Arial, sans-serif;
    background:
      radial-gradient(circle at 50% 38%, #1b2230 0%, #0c0f16 55%, #040509 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  /* subtle vignette ring for depth */
  body::before {
    content: "";
    position: absolute;
    width: 980px;
    height: 980px;
    border-radius: 50%;
    border: 1px solid rgba(212,175,55,0.12);
    top: 50px;
  }
  .card {
    text-align: center;
    position: relative;
    z-index: 2;
  }
  .icon-wrap {
    width: 300px;
    height: 300px;
    margin: 0 auto 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0 18px 40px rgba(0,0,0,0.55));
  }
  .name {
    color: #f3f4f6;
    font-size: 92px;
    font-weight: 800;
    letter-spacing: -1px;
  }
  .name span {
    background: linear-gradient(180deg, #f6e3a1 0%, #d4af37 45%, #9c7a24 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle {
    margin-top: 10px;
    color: #c9ced9;
    font-size: 30px;
    font-weight: 600;
    letter-spacing: 12px;
    text-transform: uppercase;
  }
  .rule {
    width: 120px;
    height: 2px;
    margin: 22px auto;
    background: linear-gradient(90deg, transparent, #d4af37, transparent);
  }
  .tag {
    color: #9aa1b0;
    font-size: 24px;
    font-weight: 500;
    letter-spacing: 2px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <svg width="300" height="300" viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#f8e8b0"/>
            <stop offset="45%" stop-color="#d4af37"/>
            <stop offset="100%" stop-color="#8c6c1f"/>
          </linearGradient>
          <linearGradient id="silver" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#f4f6f8"/>
            <stop offset="50%" stop-color="#c4cad4"/>
            <stop offset="100%" stop-color="#8a909c"/>
          </linearGradient>
          <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#232a3a"/>
            <stop offset="100%" stop-color="#0e121c"/>
          </linearGradient>
        </defs>

        <!-- shield body -->
        <path d="M100,8
                 C130,8 160,20 180,35
                 L180,112
                 C180,168 145,208 100,233
                 C55,208 20,168 20,112
                 L20,35
                 C40,20 70,8 100,8 Z"
              fill="url(#shieldFill)"
              stroke="url(#gold)"
              stroke-width="5"/>

        <!-- inner silver hairline -->
        <path d="M100,18
                 C126,18 152,28 169,41
                 L169,111
                 C169,160 139,196 100,219
                 C61,196 31,160 31,111
                 L31,41
                 C48,28 74,18 100,18 Z"
              fill="none"
              stroke="url(#silver)"
              stroke-width="1.5"
              opacity="0.5"/>

        <!-- padlock -->
        <rect x="76" y="118" width="48" height="40" rx="7" fill="url(#gold)"/>
        <path d="M84,118 L84,100 C84,87 93,78 100,78 C107,78 116,87 116,100 L116,118"
              fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round"/>
        <circle cx="100" cy="135" r="6" fill="#0e121c"/>
        <rect x="97" y="138" width="6" height="12" rx="2" fill="#0e121c"/>
      </svg>
    </div>
    <div class="name">M2<span>SEC</span></div>
    <div class="subtitle">Security</div>
    <div class="rule"></div>
    <div class="tag">PROTEÇÃO · AUTORIDADE · CONFIANÇA</div>
  </div>
</body>
</html>
