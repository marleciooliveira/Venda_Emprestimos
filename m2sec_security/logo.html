<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>M2SEC Security - Logo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px;
    height: 1080px;
    font-family: 'Segoe UI', Arial, sans-serif;
    background:
      radial-gradient(circle at 50% 38%, #1b2230 0%, #0c0f16 55%, #040509 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  body::before {
    content: "";
    position: absolute;
    width: 980px;
    height: 980px;
    border-radius: 50%;
    border: 1px solid rgba(212,175,55,0.12);
    top: 50px;
  }
  .bin {
    position: absolute;
    font-family: 'Consolas', monospace;
    color: rgba(212,175,55,0.08);
    font-size: 22px;
    letter-spacing: 4px;
    white-space: nowrap;
  }
  .bin1 { top: 90px; left: 90px; }
  .bin2 { bottom: 90px; right: 90px; }
  .card { text-align: center; position: relative; z-index: 2; }
  .icon-wrap {
    width: 300px; height: 300px; margin: 0 auto 26px;
    display: flex; align-items: center; justify-content: center;
    filter: drop-shadow(0 18px 40px rgba(0,0,0,0.55));
  }
  .name { color: #f3f4f6; font-size: 92px; font-weight: 800; letter-spacing: -1px; }
  .name span {
    background: linear-gradient(180deg, #f6e3a1 0%, #d4af37 45%, #9c7a24 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .subtitle { margin-top: 10px; color: #c9ced9; font-size: 28px; font-weight: 600; letter-spacing: 9px; text-transform: uppercase; }
  .rule { width: 120px; height: 2px; margin: 22px auto; background: linear-gradient(90deg, transparent, #d4af37, transparent); }
  .tag { color: #9aa1b0; font-size: 23px; font-weight: 500; letter-spacing: 2px; }
</style>
</head>
<body>
  <div class="bin bin1">01001 11010 00101</div>
  <div class="bin bin2">10110 01011 10011</div>

  <div class="card">
    <div class="icon-wrap">
      <svg width="300" height="300" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#f8e8b0"/>
            <stop offset="45%" stop-color="#d4af37"/>
            <stop offset="100%" stop-color="#8c6c1f"/>
          </linearGradient>
          <linearGradient id="silver" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#f4f6f8"/>
            <stop offset="50%" stop-color="#c4cad4"/>
            <stop offset="100%" stop-color="#8a909c"/>
          </linearGradient>
          <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#232a3a"/>
            <stop offset="100%" stop-color="#0e121c"/>
          </linearGradient>
        </defs>

        <!-- hex tech-shield badge -->
        <path d="M120,6 L213,53 L213,142 L120,234 L27,142 L27,53 Z"
              fill="url(#shieldFill)" stroke="url(#gold)" stroke-width="5"/>
        <path d="M120,20 L199,60 L199,137 L120,216 L41,137 L41,60 Z"
              fill="none" stroke="url(#silver)" stroke-width="1.4" opacity="0.45"/>

        <!-- padlock shackle as circuit trace -->
        <path d="M100,104 L100,90 C100,76 109,66 120,66 C131,66 140,76 140,90 L140,104"
              fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
        <circle cx="100" cy="104" r="4.5" fill="url(#gold)"/>
        <circle cx="140" cy="104" r="4.5" fill="url(#gold)"/>

        <!-- padlock body as PCB grid -->
        <rect x="84" y="100" width="72" height="62" rx="9"
              fill="url(#shieldFill)" stroke="url(#gold)" stroke-width="4"/>
        <!-- grid lines (circuit texture) -->
        <g stroke="url(#silver)" stroke-width="1" opacity="0.35">
          <path d="M84,118 L156,118"/>
          <path d="M84,136 L156,136"/>
          <path d="M108,100 L108,162"/>
          <path d="M132,100 L132,162"/>
        </g>
        <!-- via dots at grid intersections -->
        <g fill="url(#gold)" opacity="0.85">
          <circle cx="108" cy="118" r="2.3"/>
          <circle cx="132" cy="118" r="2.3"/>
          <circle cx="108" cy="136" r="2.3"/>
          <circle cx="132" cy="136" r="2.3"/>
        </g>
        <!-- keyhole -->
        <circle cx="120" cy="127" r="8" fill="url(#gold)"/>
        <rect x="117" y="131" width="6" height="13" rx="2" fill="url(#gold)"/>
      </svg>
    </div>
    <div class="name">M2<span>SEC</span></div>
    <div class="subtitle">Cyber Security</div>
    <div class="rule"></div>
    <div class="tag">DADOS · INFRAESTRUTURA · CONFIANÇA</div>
  </div>
</body>
</html>
